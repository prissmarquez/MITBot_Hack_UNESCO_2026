<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MILBot — Mission Verifica</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/home.css">
</head>

<body class="home-page">
    <main class="hero">
        <div class="floating-shape shape-one"></div>
        <div class="floating-shape shape-two"></div>
        <div class="floating-shape shape-three"></div>

        <header class="topbar">
            <div class="brand">
                <span class="brand-icon">🤖</span>
                <span>MIL<span class="brand-accent">Bot</span></span>
            </div>
            <div class="score-pill">⭐ <span>120</span></div>
        </header>

        <section class="hero-content">
            <div class="hero-copy">
                <span class="eyebrow">MISSION VERIFICA</span>
                <h1>Help MILBot<br><span>discover the truth!</span></h1>
                <p>Explore, investigate and make smart choices about the information you find online.</p>

                <div class="hero-actions">
                    <a class="primary-button" href="pages/map.html">
                        START MISSION <span>→</span>
                    </a>
                    <div class="mini-stats">
                        <div><strong>01</strong><span>Mission</span></div>
                        <div><strong>★</strong><span>Ready</span></div>
                    </div>
                </div>
            </div>

            <div class="robot-stage">
                <div class="glow"></div>
                <div class="orbit orbit-one"></div>
                <div class="orbit orbit-two"></div>
                <div class="robot-shadow"></div>
                <div class="milbot">
                    <div class="antenna"><span></span></div>
                    <div class="robot-head">
                        <div class="ear left"></div>
                        <div class="ear right"></div>
                        <div class="screen">
                            <span class="eye"></span>
                            <span class="eye"></span>
                            <div class="robot-smile"></div>
                        </div>
                    </div>
                    <div class="robot-body">
                        <div class="chest">M</div>
                        <div class="panel-light"></div>
                    </div>
                    <div class="arm arm-left"></div>
                    <div class="arm arm-right"></div>
                    <div class="foot foot-left"></div>
                    <div class="foot foot-right"></div>
                </div>
                <div class="speech-bubble">I need<br><strong>your help!</strong> ✨</div>
            </div>
        </section>

        <footer class="home-footer">
            <div class="tip">
                <span>💡</span>
                <p><strong>Detective tip:</strong> Don't believe everything you see. Investigate first!</p>
            </div>
            <div class="scroll-hint">EXPLORE ↓</div>
        </footer>
    </main>
</body>

</html>
