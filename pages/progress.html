<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>My Progress | MILBot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/progress.css">
</head>

<body>
    <header class="portal-header"><a class="portal-brand" href="../index.html"><span>M</span><b>MIL<i>Bot</i></b></a>
        <nav class="portal-nav"><a href="infopolis.html">Map</a><a href="missions.html">Missions</a><a
                href="library.html">Library</a><a class="active" href="progress.html">My progress</a></nav>
    </header>
    <main class="portal-page">
        <section class="portal-hero">
            <div>
                <p class="portal-eyebrow">PLAYER REPORT</p>
                <h1>Your learning <span>progress.</span></h1>
            </div>
            <p>Scores are saved automatically. Replaying a mission keeps your best result until the entire game is
                restarted.</p>
        </section>
        <section class="progress-summary">
            <article class="portal-card portal-stat"><strong id="totalPoints">0</strong><span>TOTAL POINTS</span>
            </article>
            <article class="portal-card portal-stat"><strong id="completedCount">0 / 6</strong><span>MISSIONS
                    COMPLETE</span></article>
            <article class="portal-card portal-stat"><strong id="averageScore">0%</strong><span>AVERAGE SCORE</span>
            </article>
        </section>
        <section class="portal-card"><span class="portal-tag">MISSION BREAKDOWN</span>
            <div id="progressList"></div><a class="portal-button" href="infopolis.html">Continue on the map →</a>
        </section>
    </main>
    <script src="../js/portal.js"></script>
</body>

</html>
